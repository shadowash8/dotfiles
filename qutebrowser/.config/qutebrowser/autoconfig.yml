# If a config.py file exists, this file is ignored unless it's explicitly loaded
# via config.load_autoconfig(). For more information, see:
# https://github.com/qutebrowser/qutebrowser/blob/main/doc/help/configuring.asciidoc#loading-autoconfigyml
# DO NOT edit this file by hand, qutebrowser will overwrite it.
# Instead, create a config.py - see :help for details.

config_version: 2
settings:
  bindings.commands:
    global:
      normal:
        <Alt+x>: 'cmd-set-text :'
        <Ctrl+a>: null
        <Ctrl+n>: nop
        <Ctrl+t>: nop
        <Ctrl+y>: spawn mpv {url}
        '=': cmd-set-text -s :open
        B: back
        N: forward
        O: nop
        T: hint links tab
        cc: hint images spawn sh -c "cliphist link {hint-url}"
        cs: cmd-set-text -s :config-source
        gJ: tab-move +
        gK: tab-move -
        gm: tab-move
        h: history
        o: nop
        pP: open -- {primary}
        pp: open -- {clipboard}
        pt: open -t -- {clipboard}
        q: tab-close
        qm: macro-record
        sH: config-cycle statusbar.show always never
        tH: config-cycle tabs.show multiple never
        tT: config-cycle tabs.position top left
  colors.webpage.darkmode.enabled:
    global: false
  colors.webpage.darkmode.policy.images:
    global: never
  content.javascript.clipboard:
    https://chatgpt.com: access-paste
    https://claude.ai: access-paste
    https://codeberg.org: access-paste
    https://duckduckgo.com: access-paste
    https://gemini.google.com: access-paste
    https://github.com: access-paste
    https://ox-docs.vercel.app: access-paste
  content.javascript.enabled:
    '*://accounts.arattai.in/*': true
    '*://discord.com/*': true
    '*://web.whatsapp.com/*': true
    global: true
  content.media.audio_capture:
    https://discord.com: false
  content.notifications.enabled:
    https://allen.in: false
    https://calendar.google.com: true
    https://hhkeyboard.us: false
    https://web.whatsapp.com: true
    https://www.lenovo.com: false
    https://www.youtube.com: false
  content.pdfjs:
    global: false
  content.register_protocol_handler:
    https://calendar.google.com?cid=%25s: true
  content.webgl:
    global: false
  fonts.default_family:
    global: Iosevka
  hints.dictionary:
    global: /usr/share/dict/words
  qt.args:
    global:
    - platformtheme=qt6ct
  qt.workarounds.disable_accelerated_2d_canvas:
    global: always
  scrolling.smooth:
    global: true
  statusbar.show:
    global: always
  tabs.position:
    global: top
