
# Looks
general {
    resize_on_border = true
    allow_tearing = false
    layout = master
}

decoration {
    rounding = 8
    rounding_power = 2

    active_opacity = 0.9
    inactive_opacity = 0.7

    shadow {
        enabled = false
        range = 4
        render_power = 3
    }

    blur {
        enabled = true
        size = 2
        passes = 4
    }
}
