# Keybinds
bind = SUPER, RETURN, exec, $terminal
bind = SUPER, Q, killactive,
bind = SUPER SHIFT, Q, exec, $power_menu
bind = SUPER, F, exec, $fileManager
bind = SUPER, V, exec, $clipboard_ui
bind = SUPER, U, exec, $lock
bind = SUPER, A, fullscreen,
bind = SUPER, G, togglefloating, 
bind = SUPER, S, pin,
bind = SUPER, SPACE, exec, $menu
bind = SUPER CTRL, SPACE, exec, $main_menu
bind = SUPER, B, exec, $browser
bind = SUPER, W, exec, $editor
bind = SUPER, H, exec, $music
bind = SUPER, TAB, exec, dms ipc call hypr toggleOverview
bind = SUPER, Slash, exec, solemn
bind = SUPER SHIFT, Slash, exec, silly

# Move focus between windows
bind = SUPER, N, cyclenext, l
bind = SUPER, E, cyclenext, r
bind = SUPER, Z, layoutmsg, swapwithmaster master
bind = SUPER, LEFT, layoutmsg, mfact -01
bind = SUPER, RIGHT, layoutmsg, mfact +0.1

# Move focus with mainMod + Arrow keys or HJKL
bind = SUPER CTRL, M, movefocus, l
bind = SUPER CTRL, I, movefocus, r
bind = SUPER CTRL, E, movefocus, u
bind = SUPER CTRL, N, movefocus, d

# Resize windows
bind = SUPER, R, submap, resize
submap = resize

binde = , I, resizeactive, 10 0
binde = , M, resizeactive, -10 0
binde = , E, resizeactive, 0 -10
binde = , N, resizeactive, 0 10
binde = , right, resizeactive, 10 0
binde = , left, resizeactive, -10 0
binde = , up, resizeactive, 0 -10
binde = , down, resizeactive, 0 10

bind = , escape, submap, reset
submap = reset

# Switch workspaces with mainMod + [0-9]
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Special workspace (scratchpad)
bind = SUPER, C, togglespecialworkspace, magic
bind = SUPER SHIFT, C, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Tabbed Group
bind = SUPER, K, togglegroup
bind = SUPER CTRL, TAB, changegroupactive, b
bind = SUPER SHIFT, TAB, changegroupactive, f

# === Audio Controls ===
bindel = , XF86AudioRaiseVolume, exec, dms ipc call audio increment 5
bindel = , XF86AudioLowerVolume, exec, dms ipc call audio decrement 5
bindl = , XF86AudioMute, exec, dms ipc call audio mute
bindl = , XF86AudioMicMute, exec, dms ipc call audio micmute
bindl = , XF86AudioPause, exec, dms ipc call mpris playPause
bindl = , XF86AudioPlay, exec, dms ipc call mpris playPause
bindl = , XF86AudioPrev, exec, dms ipc call mpris previous
bindl = , XF86AudioNext, exec, dms ipc call mpris next
bindel = CTRL, XF86AudioRaiseVolume, exec, dms ipc call mpris increment 5
bindel = CTRL, XF86AudioLowerVolume, exec, dms ipc call mpris decrement 5

# === Brightness Controls ===
bindel = , XF86MonBrightnessUp, exec, dms ipc call brightness increment 5 ""
bindel = , XF86MonBrightnessDown, exec, dms ipc call brightness decrement 5 ""

# === Screenshots ===
bind = , Print, exec, dms screenshot
bind = CTRL, Print, exec, dms screenshot full
bind = ALT, Print, exec, dms screenshot window

# Power Button logic
bind  = , XF86PowerOff, exec, systemctl suspend
