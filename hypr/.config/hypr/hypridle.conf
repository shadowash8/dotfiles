general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = timew stop; loginctl lock-session # lock before suspend.
    after_sleep_cmd = sleep 3; hyprctl dispatch dpms on; hyprshade auto  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 300                                # 2.5min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

listener {
    timeout = 500                                 # 5min
    on-timeout = timew stop; loginctl lock-session # lock screen when timeout has passed
}

listener {
    timeout = 600                                 # 5.5min
    on-timeout = hyprctl dispatch dpms off        # screen off when timeout has passed
    on-resume = sleep 3; hyprctl dispatch dpms on          # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 1800                                # 30min
    on-timeout = systemctl suspend                # suspend pc
}
