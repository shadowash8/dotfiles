[ids]
*

[global]
fast_tap = 1
overload_tap_timeout = 200

[main]
capslock = overload(control, esc)

a = overloadt(alt, a, 220)
s = overloadt(shift, s, 220)
d = overloadt(control, d, 220)
f = overloadt(meta, f, 220)

j = overloadt(meta, j, 220)
k = overloadt(control, k, 220)
l = overloadt(shift, l, 220)
; = overloadt(alt, ;, 220)

# --- Layer Triggers (Bottom Row) ---
leftshift = layer(media)
leftmeta = layer(system)
leftalt = layer(manipulation)
rightalt = layer(manipulation)
rightcontrol = layer(media)

[manipulation]
q = delete
w = up
e = backspace
r = C-tab
a = left
s = down
d = right
f = meta

j = left
k = down
l = up
; = right
' = enter

[media]
q = mute
w = volumeup
e = playpause
a = previoussong
s = volumedown
d = nextsong

# Internal vol controls to match your Kanata arrows
left = previoussong
down = volumedown
right = nextsong
up = volumeup

[system]
# Mimicking your brightnessctl commands
w = brightnessup
s = brightnessdown

[disable]
# Toggle back to main using your @bse logic
# In keyd, we usually just switch layers or use a toggle key
