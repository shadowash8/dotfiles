import ~/.cache/ashwal/colors-ashwc.conf
#import ~/.config/ashwc/colors.conf

# .-------------.
# | ENVIRONMENT |
# '-------------'
# you can add env variables with env <name> <value>
env EDITOR nvim
env BROWSER "flatpak run app.zen_browser.zen"

# recommended to have set
env XDG_CURRENT_DESKTOP ashwc
env XDG_SESSION_DESKTOP ashwc
env XDG_SESSION_TYPE wayland

# qt stuff
env QT_QPA_PLATFORM wayland
env QT_WAYLAND_DISABLE_WINDOWDECORATION 1
env QT_AUTO_SCREEN_SCALE_FACTOR 1

# .--------------.
# | RUN ON START |
# '--------------'
run "~/.local/bin/fix-portals.sh"
run "vicinae server"
run awww-daemon
run waybar
run dunst
run ~/.local/bin/yams
run kdeconnectd
run cosmic-settings-daemon
run cosmic-osd

# .---------.
# | OUTPUTS |
# '---------'
output eDP-1    0 0 1920 1080 60 1 normal
output HDMI-A-1 1920 0 1366 768 60 1 normal

# .-----------.
# | KEYBOARDS |
# '-----------'
keymap us ""
# keymap_options should be comma separated list of xkb options
keymap_options "grp:alt_space_toggle,compose:menu"

keyboard_rate 30
keyboard_delay 400

# .----------.
# | POINTERS |
# '----------'
pointer_sensitivity 1.5
pointer_acceleration 1
pointer_left_handed 0

# .-----------.
# | TRACKPADS |
# '-----------'
trackpad_disable_while_typing 1
trackpad_natural_scroll 1
trackpad_tap_to_click 1
trackpad_scroll_method two_fingers

gesture swipe 4 left  next_workspace
gesture swipe 4 right prev_workspace

gesture swipe 3 up    move_focus up
gesture swipe 3 down  move_focus down

gesture swipe 3 left  move_focus left
gesture swipe 3 right move_focus right

gesture swipe 4 up    toggle_fullscreen 
gesture swipe 4 down  toggle_floating

# .--------.
# | CURSOR |
# '--------'
cursor_theme JuxCursor
cursor_size 24

# .------------.
# | WORKSPACES |
# '------------'
workspace 1 eDP-1
workspace 2 eDP-1
workspace 3 eDP-1
workspace 4 eDP-1
workspace 5 eDP-1
workspace 6 eDP-1
workspace 7 eDP-1
workspace 8 eDP-1
workspace 9 HDMI-A-1
workspace 10 HDMI-A-1

# .--------.
# | LAYOUT |
# '--------'
default_layout grid
min_toplevel_size 10
client_side_decorations 0
outer_gaps 12
inner_gaps 8
# you can specify how many master toplevels you want, especially useful for wide monitors
master_count 1
# you can specify how much space will masters take;
# setting it to 0 or skipping it will space all tiled toplevel evenly
master_ratio 0.54

# .-----------.
# | EYE CANDY |
# '-----------'
border_width 4
border_radius 16
# set where to draw the rounded corners, multiple options allowed
#   - all
#   - top
#   - bottom
#   - right
#   - left
#   - top-right
#   - top-left
#   - bottom-right
#   - bottom-left
border_radius_location all
# example
# border_radius_location top_left bottom_right

# you can override these per app using window rules; see below
inactive_opacity 0.7
active_opacity 0.85
apply_opacity_when_fullscreen 0


# .------.
# | BLUR |
# '------'
blur 1
blur_passes 2
blur_radius 4
# you should keep these values similar to the values bellow, as they are really sensitive
blur_noise 0.1
blur_brightness 1
blur_contrast 1
blur_saturation 1.5

# .---------.
# | SHADOWS |
# '---------'
shadows 1
shadows_blur 15
shadows_size 5
shadows_position 0 0
shadows_color 000000ff

# .------------.
# | ANIMATIONS |
# '------------'
# enable animations
animations 1
animation_duration 400
# cubic bezier curve to use for the animation; you should use sane values here
animation_curve 0.05 0.9 0.1 1.05

# .----------.
# | KEYBINDS |
# '----------'
keybind super+shift q exit
keybind super r reload_config

keybind super return run kitty
keybind super space run "vicinae toggle"
keybind super t run "flatpak run app.zen_browser.zen"
keybind super e run cosmic-files
keybind super w run "emacs"
keybind super v run "vicinae vicinae://launch/clipboard/history"
keybind super m run "flatpak run io.github.htkhiem.Euphonica"
keybind super comma run "cosmic-settings"
keybind alt+shift escape run "cosmic-monitor"
keybind super+ctrl space run "vicinae vicinae://launch/@sovereign/awww-switcher/wpgrid"

# cycle workspaces
keybind super n next_workspace
keybind super p prev_workspace

keybind super 1 workspace 1
keybind super 2 workspace 2
keybind super 3 workspace 3
keybind super 4 workspace 4
keybind super 5 workspace 5
keybind super 6 workspace 6
keybind super 7 workspace 7
keybind super 8 workspace 8
keybind super 9 workspace 9
keybind super 0 workspace 10

keybind super+shift 1 move_to_workspace 1
keybind super+shift 2 move_to_workspace 2
keybind super+shift 3 move_to_workspace 3
keybind super+shift 4 move_to_workspace 4
keybind super+shift 5 move_to_workspace 5
keybind super+shift 6 move_to_workspace 6
keybind super+shift 7 move_to_workspace 7
keybind super+shift 8 move_to_workspace 8
keybind super+shift 9 move_to_workspace 9
keybind super+shift 0 move_to_workspace 10

keybind super z layout grid
keybind super x layout monocle
keybind super c layout canvas
keybind super b layout master

keybind super k move_focus up
keybind super j move_focus down
keybind super l move_focus right
keybind super h move_focus left

# use + for multiple modifiers
keybind super+shift k swap up
keybind super+shift j swap down
keybind super+shift l swap right
keybind super+shift h swap left

keybind super q kill_active
keybind super g toggle_floating
keybind super s toggle_sticky
# switch_floating_state is the same as toggle_floating, left for backwards compatibility
# keybind super w switch_floating_state
keybind super a toggle_fullscreen

# use _ for no modifiers (you can actually put anything there and it will work)
keybind _ XF86MonBrightnessUp run "brightnessctl set +5%"
keybind _ XF86MonBrightnessDown run "brightnessctl set 5%-"

keybind _ XF86AudioRaiseVolume run "wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+"
keybind _ XF86AudioLowerVolume run "wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"

keybind _ XF86AudioMute run "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
keybind _ XF86AudioMicMute run "wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle"

keybind _ Print run "~/.local/bin/screenshot clip"
keybind ctrl Print run "~/.local/bin/screenshot"
keybind ctrl+shift Print run "~/.local/bin/screenshot ocr"

keybind alt+shift backspace run gtklock

keybind super pointer_left_click move
keybind ctrl pointer_left_click pan 
keybind super pointer_right_click resize
keybind ctrl pointer_right_click zoom

# .--------------.
# | WINDOW RULES |
# '--------------'
# window rules are done with
# window_rule <app_id regex> <title regex> <predicate> ...args
# predicate can be
#   float - to float by default
#   size <width> <height> - to be specific size (only if floating);
#                           sizes can either be absolute or relative
#   opacity <active_value> <inactive_value> - opacity to use for this toplevel; if you wish to use the same value
#                                             for both active and inacitive state you can put just one value here
# note: you can use _ to ignore class/title
# note2: in order to find these values run `mwc-ipc toplevels` and `mwc-ipc layers`
window_rule imv _ float
window_rule imv _ size 80% 80%

window_rule nwg-look _ float
window_rule nwg-look _ size 1024 576

window_rule kvantummanager _ float
window_rule kvantummanager _ size 1024 576

window_rule org.pulseaudio.pavucontrol _ float
window_rule org.pulseaudio.pavucontrol _ size 1024 576

window_rule blueman-manager _ float
window_rule blueman-manager _ size 1024 576

window_rule nm-connection-editor _ float
window_rule nm-connection-editor _ size 1024 576

window_rule zen Library float
window_rule zen Library size 1024 576

window_rule _ Picture-in-Picture sticky

window_rule com.system76.CosmicSettings _ float

# set opacity rules; later matches override previous ones
# e.g. if you want firefox to be transperent, except when youtube is playing do
window_rule firefox .*YouTube.* opacity 1

# layer rules for bluring them
layer_rule rofi blur
