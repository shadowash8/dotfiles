monitorrule=name:eDP-1,width:1920,height:1080,refresh:60,x:0,y:0,vrr=1

# --- Environment Variables ---
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GDK_BACKEND,wayland,x11
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

# --- Autostart ---
# Start Polkit Agent
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=wlroots
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec = xrdb -merge ~/.Xresources
exec = sh -c "swaybg -i $(cat ~/.cache/wal/wal)"
exec-once = waybar
exec-once = dunst
exec-once = cliphist wipe
exec-once = wl-paste --watch cliphist store
exec-once = hypridle

# --- Window & Animation Effects ---
blur=1
blur_layer=3
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
border_radius=6
focused_opacity=0.9
unfocused_opacity=0.8

animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_duration_move=500

# --- Appearance & Layout ---
gappih=5
gappiv=5
gappoh=10
gappov=10
borderpx=4
bordercolor=0x444444ff
focuscolor=0xc9b890ff

# --- Keybindings ---

# Launchers
bind=SUPER,space,spawn,rofi -show drun
bind=SUPER,Return,spawn, foot
bind=SUPER,v,spawn,cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind=SUPER,b,spawn,qbpm choose
bind=SUPER,e,spawn,thunar
bind=SUPER,w,spawn,emacsclient -c -a emacs
bind=SUPER,p,spawn,connect
bind=SUPER,m,spawn,foot rmpc
bind=SUPER,u,spawn,~/.config/scripts/lock.sh
bind=SUPER+CTRL,r,spawn,~/.config/scripts/websearch
bind=SUPER+SHIFT,space,spawn,~/.config/scripts/notes

# Session & Window Management
bind=SUPER,r,reload_config
bind=SUPER+SHIFT,m,quit
bind=SUPER,q,killclient
bind=SUPER,Tab,toggleoverview
bind=SUPER,f,togglefullscreen
bind=SUPER,g,togglefloating
bind=SUPER,a,togglemaximizescreen
bind=SUPER,n,switch_layout
bind=SUPER,d,toggleglobal,

# Navigation (Focus)
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# Tag Switching
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

# Move Window to Tag
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# Resize Windows
bind=SUPER+CTRL,k,resizewin,+0,-50
bind=SUPER+CTRL,j,resizewin,+0,+50
bind=SUPER+CTRL,h,resizewin,-50,+0
bind=SUPER+CTRL,l,resizewin,+50,+0

# Move Windows
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right

# Gaps
bind=SUPER+SHIFT,X,incgaps,1
bind=SUPER+SHIFT,Z,incgaps,-1
bind=SUPER+SHIFT,R,togglegaps

# Mouse Button Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# --- System Config ---
# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us

# Trackpad
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
disable_while_typing=1
left_handed=0
middle_button_emulation=1
swipe_min_threshold=1

no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
