# --- DMS ---
source = ./dms/colors.conf

# --- Environment Variables ---
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,gtk3
env = QT_QPA_PLATFORMTHEME_QT6,gtk3
env = GDK_BACKEND,wayland,x11
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

# --- Autostart ---
# Start Polkit Agent
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = dbus-launch dms run
exec-once = emacs --daemon

# --- Window & Animation Effects ---
blur=4
blur_layer=1
blur_optimized=1
blur_params_num_passes = 3
blur_params_radius = 3
border_radius=8
focused_opacity=0.9
unfocused_opacity=0.7

# layers
layer_animations=1
layer_animation_type_open=fade
layer_animation_type_close=fade

# windows
animation_type_open=slide
animation_type_close=slide
animation_duration_open=500
animation_duration_move=500
animation_duration_tag=400
animation_curve_open=0.16, 1, 0.3, 1
animation_curve_move=0.16, 1, 0.3, 1
animation_curve_tag=0.16, 1, 0.3, 1

hotarea_size=2

# --- Appearance & Layout ---
gappih=5
gappiv=5
gappoh=10
gappov=10
borderpx=2

# --- Rules ---
windowrule=isterm:1,appid:foot
windowrule=isfloating:1,appid:xfce4-appfinder
windowrule=isfloating:1,isglobal:1,title:Picture-in-Picture
windowrule=isfloating:1,isglobal:1,title:Picture in picture
windowrule=isfloating:1,appid:firefox,title:"Firefox - Choose User Profile"

layerrule=noblur:1,layer_name:selection
layerrule=animation_type_open:zoom,animation_type_close:zoom,noanim:0,layer_name:rofi
layerrule=noanim:1,noshadow:1,layer_name:dunst

# --- Keybindings ---

# Launchers
bind=SUPER,space,spawn,dms ipc spotlight toggle
bind=SUPER,Return,spawn,foot
bind=SUPER,v,spawn,dms ipc clipboard toggle
bind=SUPER,u,spawn,dms ipc lock lock
bind=SUPER,b,spawn,zen-browser
bind=SUPER,e,spawn,pcmanfm
bind=SUPER,w,spawn,emacsclient -c -a emacs
bind=SUPER,p,spawn,connect
bind=SUPER,m,spawn,foot rmpc
bind=SUPER+CTRL,space,spawn,dms ipc dankdash wallpaper


# Session & Window Management
bind=SUPER,r,reload_config
bind=SUPER+SHIFT,q,spawn,dms ipc powermenu toggle
bind=SUPER,q,killclient
bind=SUPER,Tab,toggleoverview
bind=SUPER,f,togglefullscreen
bind=SUPER,g,togglefloating
bind=SUPER,a,togglemaximizescreen
bind=SUPER,d,toggleglobal,

# Navigation (Focus)
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

bind=SUPER+ALT,h,viewtoleft
bind=SUPER+ALT,l,viewtoright

# Tag Switching
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

# Move Window to Tag
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# Resize Windows
bind=SUPER+CTRL,k,resizewin,+0,-50
bind=SUPER+CTRL,j,resizewin,+0,+50
bind=SUPER+CTRL,h,resizewin,-50,+0
bind=SUPER+CTRL,l,resizewin,+50,+0

# Move Windows
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right

# Layouts
bind=SUPER,n,switch_layout
bind=SUPER,z,setlayout,tile
bind=SUPER,x,setlayout,scroller
bind=SUPER,c,setlayout,grid

# Mouse Button Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# System Keys
bind=NONE,XF86AudioRaiseVolume,spawn_shell,~/.config/scripts/osd volume 5%+
bind=NONE,XF86AudioLowerVolume,spawn_shell,~/.config/scripts/osd volume 5%-
bind=NONE,XF86AudioMute,spawn_shell,~/.config/scripts/osd volume toggle

bind=NONE,XF86MonBrightnessUp,spawn_shell,~/.config/scripts/osd brightness 5%+
bind=NONE,XF86MonBrightnessDown,spawn_shell,~/.config/scripts/osd brightness 5%-

bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Screenshot Keys
bind=NONE,Print,spawn_shell,screenshot clip
bind=CTRL,Print,spawn_shell,dms screenshot
bind=SHIFT,Print,spawn_shell,screenshot ocr
bind=CTRL+SHIFT,Print,spawn_shell,screenshot color

# --- System Config ---

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us
xkb_rules_variant=colemak_dh

# Trackpad
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
scroll_method=1
middle_button_emulation=1
swipe_min_threshold=20

# Gestures
# 3-finger: Window focus
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,togglemaximizescreen
gesturebind=none,down,3,togglefloating

# 4-finger: Workspace navigation
gesturebind=none,left,4,viewtoleft
gesturebind=none,right,4,viewtoright
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview


source=./dms/cursor.conf

source=./dms/outputs.conf
