# i3blocks config file
# Global properties
separator=true
separator_block_width=15

[network]
label=wifi: 
command=nmcli -t -f SIGNAL,ACTIVE dev wifi | grep 'yes' | cut -d: -f1 | awk '{print $1 "%"}'
interval=10
color=#ffffff
# This matches your rofi click action
onclick=rofi -show wifi -modi "wifi:iwdrofimenu"

[protonvpn]
# Matches your: test -d /proc/sys/net/ipv4/conf/protonvpn/
command=if [ -d /proc/sys/net/ipv4/conf/protonvpn/ ]; then echo "[V]"; else echo ""; fi
interval=5
color=#00FF00

[pulseaudio]
label=volume: 
command=pactl list sinks | grep '^[[:space:]]Volume:' | head -n $(( $SINK + 1 )) | tail -n 1 | sed -e 's,.* \([0-9][0-9]*\)%.*,\1%,'
interval=1
signal=10
# Matches your click action
onclick=pavucontrol

[clock]
label=
command=date '+%H:%M'
interval=5
color=#ffffff
