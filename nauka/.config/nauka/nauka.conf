#import ~/.cache/ashwal/colors-nauka.conf
import noctalia.conf

# Autostart
run noctalia
run ~/.local/bin/yams
run kdeconnectd
#run ~/.local/bin/fix-portals.sh
run ~/.local/bin/battery-notify.sh

# ENV
env QT_QPA_PLATFORMTHEME qt6ct

# Border
border_width 3

outer_gap 16
inner_gap 16

# Inputs
focus_follows_mouse true
keyboard_layout us

cursor_theme macOS
cursor_size 32

# Eye Candy
border_radius 16
opacity_active 0.8
opacity_inactive 0.7

blur true
blur_strength 4.0
blur_alpha 1

shadow 1
shadow_floating_only 0
shadow_blur 2
shadow_spread 1
shadow_offset_x 0
shadow_offset_y 0
shadow_color #000000fe

# Animation
animation_duration 300 # ms
animation_curve 0.16, 1.0, 0.3, 1.0

# Misc
xwayland 1
default_layout scroller
new_window_position bottom

# Keybinds
keybind super return run kitty
keybind alt return run kitty
keybind super space run "noctalia msg panel-toggle launcher"
keybind super t run "flatpak run app.zen_browser.zen"
keybind super e run dolphin
keybind super w run "emacsclient -c -a emacs"
keybind super m run "flatpak run com.github.taiko2k.tauonmb"
keybind super v run "noctalia msg panel-toggle clipboard"
keybind super comma run "noctalia msg settings-toggle"
keybind super q kill_active
keybind super j prev_toplevel
keybind super k next_toplevel
keybind super+shift j swap_prev_toplevel
keybind super+shift k swap_next_toplevel
keybind super r reload
keybind alt r reload
keybind super g toggle_floating
keybind super s toggle_sticky
keybind super a toggle_fullscreen
keybind super x layout grid
keybind super c layout master
keybind super z layout scroller
keybind super equal grow_focused
keybind super minus shrink_focused
keybind super+shift q exit

keybind super pointer_left_click move
keybind super pointer_right_click resize

# View tags
keybind super 1 view_tag
keybind super 2 view_tag
keybind super 3 view_tag
keybind super 4 view_tag
keybind super 5 view_tag
keybind super 6 view_tag
keybind super 7 view_tag
keybind super 8 view_tag
keybind super 9 view_tag

# Move focused window to tag
keybind super+shift 1 move_focused_to_tag
keybind super+shift 2 move_focused_to_tag
keybind super+shift 3 move_focused_to_tag
keybind super+shift 4 move_focused_to_tag
keybind super+shift 5 move_focused_to_tag
keybind super+shift 6 move_focused_to_tag
keybind super+shift 7 move_focused_to_tag
keybind super+shift 8 move_focused_to_tag
keybind super+shift 9 move_focused_to_tag

# # Brightness
# keybind _ XF86MonBrightnessUp   run "swayosd-client --brightness raise"
# keybind _ XF86MonBrightnessDown run "swayosd-client --brightness lower"
#
# # Volume
# keybind _ XF86AudioRaiseVolume run "swayosd-client --output-volume +2 --max-volume 150"
# keybind _ XF86AudioLowerVolume run "swayosd-client --output-volume -2 --max-volume 150"
#
# # Mute
# keybind _ XF86AudioMute         run "swayosd-client --output-volume mute-toggle"
# keybind _ XF86AudioMicMute      run "swayosd-client --input-volume mute-toggle"

keybind _ XF86MonBrightnessUp run "brightnessctl set +5%"
keybind _ XF86MonBrightnessDown run "brightnessctl set 5%-"

keybind _ XF86AudioRaiseVolume run "wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+"
keybind _ XF86AudioLowerVolume run "wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"

keybind _ XF86AudioMute run "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
keybind _ XF86AudioMicMute run "wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle"

keybind _ Print run "~/.local/bin/screenshot clip"
keybind ctrl Print run "~/.local/bin/screenshot"
keybind ctrl+shift Print run "~/.local/bin/screenshot ocr"

# Window Rules
# window_rule <app_id regex> <title regex> <predicate> ...args
# predicates can be
#   float - to float by default
#   tile  - to force tiled even if the window would normally float
#   size <width> <height> - to be specific size (only if floating);
#                           sizes can either be absolute or relative (80%)
#   sticky - show the window on every tag
#   fullscreen - map the window fullscreen
#   tag <1-9> - assign the window to a tag instead of the current one
#   opacity <active_value> <inactive_value> - opacity to use for this
#                           toplevel; if you wish to use the same value for
#                           both active and inactive state you can put just
#                           one value here
#   radius <n> - per-window border radius
# note: use _ to ignore app_id/title
# note: matching rules apply in file order; later rules override earlier
#       ones for the property they set

window_rule noctalia _ float
window_rule noctalia _ size 1024 840

window_rule nwg-look _ float
window_rule nwg-look _ size 1024 576

window_rule org.pulseaudio.pavucontrol _ float
window_rule org.pulseaudio.pavucontrol _ size 1024 576

window_rule emacs _ tag 1

window_rule _ Picture-in-Picture sticky
window_rule _ Picture-in-Picture opacity 1 1
