# import external config files
# for example ashwal colors:
# import ~/.cache/ashwal/colors-nauka.conf

# Autostart
# run

# Border
border_width 3
border_color_active #e6992eff
border_color_inactive #4d4d4dff

# Eye Candy
border_radius 18
opacity_active 0.8
opacity_inactive 0.7

blur 1
blur_strength 4.0
blur_alpha 1

shadow 0
shadow_floating_only 1
shadow_blur 25
shadow_spread 3
shadow_offset_x 7
shadow_offset_y 7
shadow_color #000000fe

# Animation
animation_duration 300 # ms
animation_curve 0.0, 0.85, 0.2, 1.0 # cubic-bezier x1, y1, x2, y2

# Input
cursor_theme macOS
cursor_size 32

focus_follows_mouse true
keyboard_layout us
keyboard_variant colemak_dh
keyboard_options "caps:return"

# Misc
xwayland true # default is false as it is opt-in
default_layout grid # available layouts are grid, master and scroller
new_window_position bottom # bottom or top options available

# Window Rules
# window_rule <app_id regex> <title regex> <predicate> ...args
# predicates can be
#   float - to float by default
#   tile  - to force tiled even if the window would normally float
#   size <width> <height> - to be specific size (only if floating);
#                           sizes can either be absolute or relative (80%)
#   sticky - show the window on every tag
#   fullscreen - map the window fullscreen
#   tag <1-9> - assign the window to a tag instead of the current one
#   opacity <active_value> <inactive_value> - opacity to use for this
#                           toplevel; if you wish to use the same value for
#                           both active and inactive state you can put just
#                           one value here
#   radius <n> - per-window border radius
# note: use _ to ignore app_id/title
# note: matching rules apply in file order; later rules override earlier
#       ones for the property they set
window_rule nwg-look _ float
window_rule nwg-look _ size 1024 576

window_rule kvantummanager _ float
window_rule kvantummanager _ size 1024 576

window_rule org.pulseaudio.pavucontrol _ float
window_rule org.pulseaudio.pavucontrol _ size 1024 576

window_rule blueman-manager _ float
window_rule blueman-manager _ size 1024 576

window_rule nm-connection-editor _ float
window_rule nm-connection-editor _ size 1024 576

window_rule zen Library float
window_rule zen Library size 1024 576

window_rule _ Picture-in-Picture sticky
window_rule _ Picture-in-Picture opacity 1 1

# set opacity rules; later matches override previous ones
# e.g. if you want firefox to be transparent, except when youtube is playing
window_rule firefox .*YouTube.* opacity 1

# Keybinds
keybind alt return run kitty
keybind alt q kill_active
keybind alt j next_toplevel
keybind alt k prev_toplevel
keybind alt+shift j swap_prev_toplevel
keybind alt+shift k swap_next_toplevel
keybind alt g toggle_floating
keybind alt s toggle_sticky
keybind supes z layout scroller
keybind alt x layout grid
keybind alt c layout master
keybind alt r reload
keybind alt equal grow_focused
keybind alt minus shrink_focused
keybind alt+shift q exit

# Pointer
keybind alt pointer_left_click move
keybind alt pointer_right_click resize

# View tags
keybind alt 1 view_tag
keybind alt 2 view_tag
keybind alt 3 view_tag
keybind alt 4 view_tag
keybind alt 5 view_tag
keybind alt 6 view_tag
keybind alt 7 view_tag
keybind alt 8 view_tag
keybind alt 9 view_tag

# Move focused window to tag
keybind alt+shift 1 move_focused_to_tag
keybind alt+shift 2 move_focused_to_tag
keybind alt+shift 3 move_focused_to_tag
keybind alt+shift 4 move_focused_to_tag
keybind alt+shift 5 move_focused_to_tag
keybind alt+shift 6 move_focused_to_tag
keybind alt+shift 7 move_focused_to_tag
keybind alt+shift 8 move_focused_to_tag
keybind alt+shift 9 move_focused_to_tag

# Screenshot, Volume and Brightness
keybind _ XF86MonBrightnessUp run "brightnessctl set +5%"
keybind _ XF86MonBrightnessDown run "brightnessctl set 5%-"

keybind _ XF86AudioRaiseVolume run "wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+"
keybind _ XF86AudioLowerVolume run "wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"

keybind _ XF86AudioMute run "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
keybind _ XF86AudioMicMute run "wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle"

keybind _ Print run "~/.local/bin/screenshot clip"
keybind ctrl Print run "~/.local/bin/screenshot"
keybind ctrl+shift Print run "~/.local/bin/screenshot ocr"
